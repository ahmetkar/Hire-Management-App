name: Build & Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Affected Applications
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      apps: ${{ steps.affected.outputs.apps }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Install Dependencies
        run: npm ci

      - name: Detect affected applications
        id: affected
        shell: bash
        run: |
          APPS=$(npx nx show projects --affected --type=app)

          echo "Affected applications:"
          echo "$APPS"

          JSON=$(printf '%s\n' "$APPS" \
            | jq -R 'select(length > 0)' \
            | jq -s -c .)

          echo "Generated JSON:"
          echo "$JSON"

          echo "apps=$JSON" >> "$GITHUB_OUTPUT"

      - name: Print detected applications
        run: |
          echo "Affected Apps:"
          echo '${{ steps.affected.outputs.apps }}'
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: detect

    if: needs.detect.outputs.apps != '[]'

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          build-args: |
            APP_NAME=${{ matrix.app }}

          tags: |
            ghcr.io/${{ github.repository_owner }}/hrmanagement-${{ matrix.app }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: false
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - detect
      - build

    if: needs.detect.outputs.apps != '[]'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install jq and yq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq

      - name: Update deployment images
        env:
          APPS: ${{ needs.detect.outputs.apps }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          echo "$APPS" | jq -r '.[]' | while read APP
          do
            echo "Updating $APP"

            yq -i '
              (.spec.template.spec.containers[]
                | select(.name == "'"$APP"'")).image =
              "ghcr.io/'"$OWNER"'/hrmanagement-'"$APP"':'"$SHA"'"
            ' k8s/base/$APP/deployment.yaml
          done

      - name: Commit manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "ci: update kubernetes manifests (${GITHUB_SHA::7})"

      - name: Push changes
        run: |
          for i in {1..5}
          do
            git pull --rebase origin main

            if git push origin main
            then
              echo "Push successful."
              exit 0
            fi

            echo "Retry $i..."
            sleep 3
          done

          echo "Push failed."
          exit 1