services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - hrmanagement
  grafana:
    image: grafana/grafana

    container_name: grafana

    ports:
      - "3002:3000"

    volumes:
      - grafana-storage:/var/lib/grafana

    networks:
      - hrmanagement

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hrmanagement

  redis:
    image: redis/redis-stack:6.2.6-v19
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass cantremember"
    ports:
      - "6380:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cantremember", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hrmanagement

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      - "19094:9094" # Sadece hosttan bağlanacaksan gerekli
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:19094"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/9092"]
      interval: 20s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - hrmanagement

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hrmanagement
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - hrmanagement

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    ports:
     - "9200:9200"

    volumes:
      - elastic_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200 >/dev/null || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - hrmanagement

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: auth-service

    restart: unless-stopped

    env_file:
      - ./apps/auth-service/.env.production

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - hrmanagement

  staff-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: staff-service

    restart: unless-stopped

    env_file:
      - ./apps/staff-service/.env.production

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - hrmanagement

  job-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: job-service

    restart: unless-stopped

    env_file:
      - ./apps/job-service/.env.production

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    networks:
      - hrmanagement

  management-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: management-service

    restart: unless-stopped

    env_file:
      - ./apps/management-service/.env.production

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - hrmanagement

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: ai-service

    restart: unless-stopped

    env_file:
      - ./apps/ai-service/.env.production

    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - hrmanagement

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway

    restart: unless-stopped

    env_file:
      - ./apps/api-gateway/.env.production

    depends_on:
      auth-service:
        condition: service_started
      staff-service:
        condition: service_started
      job-service:
        condition: service_started  
      management-service:
        condition: service_started
      ai-service:
        condition: service_started

    ports:
      - "4000:4000"

    networks:
      - hrmanagement

volumes:
  mongodb_data:
  redis_data:
  kafka_data:
  elastic_data:
  grafana-storage:

networks:
  hrmanagement:
    driver: bridge