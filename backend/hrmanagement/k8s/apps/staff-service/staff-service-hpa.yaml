apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: staff-service-hpa
  namespace: hrmanagement
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: staff-service
  minReplicas: 3
  maxReplicas: 8

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
