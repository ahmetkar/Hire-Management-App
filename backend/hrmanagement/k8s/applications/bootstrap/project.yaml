apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: hrmanagement
  namespace: argocd

spec:
  description: HR Management GitOps Project

  sourceRepos:
    - "https://github.com/ahmetkar/Hire-Management-App.git"

  destinations:
    - namespace: hrmanagement
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true