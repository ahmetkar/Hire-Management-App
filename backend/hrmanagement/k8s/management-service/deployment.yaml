apiVersion: apps/v1
kind: Deployment

metadata:
  name: management-service
  namespace: hrmanagement

spec:
  replicas: 1

  selector:
    matchLabels:
      app: management-service

  template:
    metadata:
      labels:
        app: management-service

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: management-service

          image: ghcr.io/ahmetkar/hrmanagement-management-service:v1.0.0

          imagePullPolicy: Always

          ports:
            - containerPort: 3332

          envFrom:
            - configMapRef:
                name: management-service-config

            - secretRef:
                name: management-service-secret