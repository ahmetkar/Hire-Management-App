apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: hrmanagement

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: api-gateway
          image: ghcr.io/ahmetkar/hrmanagement-api-gateway:v1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 4000

          envFrom:
            - configMapRef:
                name: api-gateway-config

            - secretRef:
                name: api-gateway-secret