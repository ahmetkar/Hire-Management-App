apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: hrmanagement

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: auth-service

          image: ghcr.io/ahmetkar/hrmanagement-auth-service:v1.0.0

          imagePullPolicy: Always

          ports:
            - containerPort: 3330

          envFrom:
            - configMapRef:
                name: auth-service-config

            - secretRef:
                name: auth-service-secret