apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service
  namespace: hrmanagement

spec:
  replicas: 3

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: ai-service

          image: ghcr.io/ahmetkar/hrmanagement-ai-service:v1.0.0

          imagePullPolicy: Always

          ports:
            - containerPort: 3334

          envFrom:
            - configMapRef:
                name: ai-service-config

            - secretRef:
                name: ai-service-secret