apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: hrmanagement

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana

          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          ports:
            - containerPort: 3000

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin

          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 40

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc