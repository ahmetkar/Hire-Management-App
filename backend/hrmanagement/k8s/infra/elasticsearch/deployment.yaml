apiVersion: apps/v1
kind: Deployment

metadata:
  name: elasticsearch
  namespace: hrmanagement

spec:
  replicas: 1

  selector:
    matchLabels:
      app: elasticsearch

  template:
    metadata:
      labels:
        app: elasticsearch

    spec:
      containers:
        - name: elasticsearch

          image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 9200
            - containerPort: 9300
          
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"

            limits:
              cpu: "2000m"
              memory: "4Gi"
          env:
            - name: discovery.type
              value: single-node

            - name: xpack.security.enabled
              value: "false"

            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data

          resources:
            requests:
              cpu: 500m
              memory: 1Gi

            limits:
              cpu: "2"
              memory: 2Gi

          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20

      volumes:
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-pvc




            