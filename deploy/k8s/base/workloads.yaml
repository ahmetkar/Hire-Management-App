# ==========================================================
# JOB SERVICE
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-service
  template:
    metadata:
      labels:
        app: job-service
    spec:
      nodeSelector:
        workload: app
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: job-service
          image: ghcr.io/ahmetkar/hire-management-app-job-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3331
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SERVICE_NAME
              value: "job-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hm-db-secret
                  key: DATABASE_URL
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hm-internal-secret
                  key: INTERNAL_API_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: REDIS_PASSWORD
            - name: KAFKA_SASL_USERNAME
              value: "hm-backend"
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hm-backend
                  key: password
            - name: KAFKA_CA_PATH
              value: "/etc/kafka/ca.crt"
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka/ca.crt
              subPath: ca.crt
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 700m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: kafka-ca
          secret:
            secretName: hm-kafka-cluster-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: job-service
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: job-service
  ports:
    - name: http
      port: 3331
      targetPort: http

