name: Deploy Infrastructure

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Bootstrap Build & Deploy"
    types:
      - completed
    paths:
      - 'backend/hrmanagement/k8s/infra/**'

permissions:
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Check TCP connectivity
        run: |
            nc -vz ${{ secrets.SSH_HOST }} ${{ secrets.SSH_PORT }}

      - name: Deploy Infrastructure
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true

          script: |

            set -e

            echo "===== Infrastructure Deploy Started ====="

            cd /home/ubuntu/Hire-Management-App/backend/hrmanagement

            git fetch origin

            git reset --hard origin/main

            kubectl apply -k k8s/infra

            echo "Waiting StatefulSets..."

            kubectl rollout status statefulset/mongodb \
              -n hrmanagement \
              --timeout=600s

            kubectl rollout status deployment/redis \
              -n hrmanagement \
              --timeout=600s


            echo "Waiting Deployments..."

            kubectl rollout status deployment/elasticsearch \
              -n hrmanagement \
              --timeout=600s

            kubectl rollout status deployment/prometheus \
              -n hrmanagement \
              --timeout=600s

            kubectl rollout status deployment/grafana \
              -n hrmanagement \
              --timeout=600s

            echo "Infrastructure Status"

            kubectl get pods -n hrmanagement

            kubectl get pvc -n hrmanagement

            kubectl get svc -n hrmanagement

            echo "Infrastructure Deploy Finished"