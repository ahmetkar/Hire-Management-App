name: Rollback Application

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service Name"
        required: true
        type: choice
        options:
          - api-gateway
          - auth-service
          - staff-service
          - management-service
          - job-service
          - ai-service

      image_tag:
        description: "Image Tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Rollback Image
        working-directory: backend/hrmanagement
        run: |

          cd k8s/apps/${{ github.event.inputs.service }}

          kustomize edit set image \
          ghcr.io/${{ github.repository_owner }}/hrmanagement-${{ github.event.inputs.service }}=\
          ghcr.io/${{ github.repository_owner }}/hrmanagement-${{ github.event.inputs.service }}:${{ github.event.inputs.image_tag }}

      - name: Commit
        working-directory: backend/hrmanagement
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "rollback(${{ github.event.inputs.service }}): ${{ github.event.inputs.image_tag }}"

          git push