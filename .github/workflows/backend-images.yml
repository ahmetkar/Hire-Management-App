name: Build and Publish Backend Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/hrmanagement/**"
      - ".github/workflows/backend-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app:
          - auth-service
          - job-service
          - staff-service
          - management-service
          - api-gateway
          - ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/hrmanagement
          file: ./backend/hrmanagement/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: |
            ghcr.io/ahmetkar/hire-management-app-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/ahmetkar/hire-management-app-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
