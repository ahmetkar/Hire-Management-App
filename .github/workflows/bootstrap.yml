name: Bootstrap Build & Deploy

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_PREFIX: hrmanagement

jobs:

  bootstrap:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - staff-service
          - management-service
          - job-service
          - ai-service

    defaults:
      run:
        working-directory: backend/hrmanagement

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/hrmanagement/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: backend/hrmanagement
          file: backend/hrmanagement/Dockerfile
          push: true

          build-args: |
            APP_NAME=${{ matrix.service }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:

    needs: bootstrap

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/hrmanagement

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update Images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |

          for SERVICE in \
            api-gateway \
            auth-service \
            staff-service \
            management-service \
            job-service \
            ai-service
          do

            cd k8s/apps/$SERVICE

            kustomize edit set image \
              ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}-${SERVICE}=\
              ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}-${SERVICE}:${TAG}

            cd ../../..

          done

      - name: Commit Manifest Changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet
          then
            echo "No manifest changes."
            exit 0
          fi

          git add .

          git commit -m "chore(bootstrap): initialize image tags (${{ steps.tag.outputs.tag }}) [skip ci]"

          git push