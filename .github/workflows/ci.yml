name: Build & Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/kustomization.yaml'

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_PREFIX: hrmanagement
  WORKDIR: backend/hrmanagement
jobs:
  detect:

    name: Detect Affected Services

    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}
      tag: ${{ steps.tag.outputs.tag }}

    defaults:
      run:
        working-directory: backend/hrmanagement

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/hrmanagement/package-lock.json

      - run: npm ci

      - id: tag
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: detect
        shell: bash
        run: |

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi

          SERVICES=$(npx nx show projects \
            --affected \
            --type app \
            --base=$BASE \
            --head=$HEAD)

          JSON=$(echo "$SERVICES" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "services=$JSON" >> "$GITHUB_OUTPUT"

          echo "$JSON"


  build:

    name: Build & Push Images

    needs: detect

    if: needs.detect.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}

    defaults:
      run:
        working-directory: backend/hrmanagement

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.detect.outputs.tag }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:

          context: backend/hrmanagement

          file: backend/hrmanagement/Dockerfile

          push: true

          build-args: |
            APP_NAME=${{ matrix.service }}

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max
  update-manifests:

    name: Update Kubernetes Manifests

    needs:
      - detect
      - build

    if: needs.detect.outputs.services != '[]'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/hrmanagement

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update Image Tags
        shell: bash
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |

          for SERVICE in $(echo '${{ needs.detect.outputs.services }}' | jq -r '.[]')
          do

            echo "Updating ${SERVICE}"

            cd k8s/apps/${SERVICE}

            kustomize edit set image \
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}-${SERVICE}=\
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}-${SERVICE}:${TAG}

            cd ../../..

          done

      - name: Commit Changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet
          then
            echo "Nothing changed."
            exit 0
          fi

          git add .

          git commit -m "chore(ci): update image tags (${TAG}) [skip ci]"

          git push